[package]
name = "faceit-lite"
version = "0.3.0"
edition = "2021"
description = "Lightweight, customizable FACEIT desktop client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
discord-rich-presence = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

# Маленький и быстрый release-бинарник
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Прямой доступ к WebView2: прятать сайт «по-настоящему» (невидим + мало RAM)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
