name: Build Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Опубликовать релиз с этим тегом (например v0.1.0). Пусто — только собрать."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci || npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: faceit-lite-windows
          path: |
            src-tauri/target/release/faceit-lite.exe
            src-tauri/target/release/bundle/nsis/*.exe

      # При пуше тега vX.Y.Z или ручном запуске с release_tag — публикуем GitHub Release с обоими exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          mkdir -p release
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "release/FACEIT-Lite_${VER}_x64-setup.exe"
          cp src-tauri/target/release/faceit-lite.exe "release/FACEIT-Lite_${VER}_x64-portable.exe"
          sed "s/VERSION/${VER}/g" .github/release-notes.md > release/notes.md
          gh release create "$TAG" release/*.exe \
            --target "$GITHUB_SHA" \
            --title "FACEIT Lite ${TAG}" \
            --notes-file release/notes.md \
            --prerelease
