name: Build Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Опубликовать релиз с этим тегом (например v0.2.0). Пусто — только собрать."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci || npm install

      # Тег релиза должен совпадать с версией приложения, иначе автообновление зациклится
      - name: Check version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          APP_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v${APP_VER}" != "${RELEASE_TAG}" ]; then
            echo "::error::Тег ${RELEASE_TAG} не совпадает с версией приложения ${APP_VER} (tauri.conf.json / Cargo.toml / package.json)"
            exit 1
          fi

      # Релизная сборка подписывается ключом обновлений; обычная — без подписи
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "::error::Нет секрета TAURI_SIGNING_PRIVATE_KEY — см. README, раздел «Автообновление»"
              exit 1
            fi
            npm run build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npm run build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: faceit-lite-windows
          path: |
            src-tauri/target/release/faceit-lite.exe
            src-tauri/target/release/bundle/nsis/*.exe

      # Релиз: установщик, portable и latest.json для автообновления
      - name: Publish release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${RELEASE_TAG#v}"
          SETUP_NAME="FACEIT-Lite_${VER}_x64-setup.exe"
          mkdir -p release
          SRC=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$SRC" "release/${SETUP_NAME}"
          cp src-tauri/target/release/faceit-lite.exe "release/FACEIT-Lite_${VER}_x64-portable.exe"
          sed "s/VERSION/${VER}/g" .github/release-notes.md > release/notes.md

          SIG=$(cat "${SRC}.sig")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${SETUP_NAME}"
          SIG="$SIG" URL="$URL" VER="$VER" node -e '
            const fs = require("fs");
            fs.writeFileSync("release/latest.json", JSON.stringify({
              version: process.env.VER,
              notes: "FACEIT Lite " + process.env.VER,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: process.env.SIG, url: process.env.URL } }
            }, null, 2));
          '
          cat release/latest.json

          gh release create "$RELEASE_TAG" release/*.exe release/latest.json \
            --target "$GITHUB_SHA" \
            --title "FACEIT Lite ${RELEASE_TAG}" \
            --notes-file release/notes.md
